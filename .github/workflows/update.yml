name: Cập nhật dữ liệu TFT
on:
  schedule: [{cron: "0 1 * * *"}]   # mỗi ngày 08:00 giờ VN
  workflow_dispatch:                 # cho phép bấm chạy tay
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python patch_index.py
      - run: python update.py
        env:
          COMPS_CSV_URL: ${{ vars.COMPS_CSV_URL }}
      - name: Lưu nếu có thay đổi
        run: |
          git config user.name "tft-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --staged --quiet || git commit -m "Cập nhật dữ liệu $(date +%F)"; git push
